name: Desktop Release And Tests

on:
  pull_request:
  push:
    branches: [master, main, '041-post/**']
  workflow_call:
    inputs:
      hub_only:
        description: Run Hub and contract regressions without rebuilding the unchanged engine
        required: false
        type: boolean
        default: false
      sign_windows_release:
        description: Request SignPath signing for Windows release artifacts
        required: false
        type: boolean
        default: false
      publish_release:
        description: Publish verified artifacts to GitHub, PyPI and R2
        required: false
        type: boolean
        default: false
      replace_existing_release:
        description: Allow recovery publication to an existing unpublished draft
        required: false
        type: boolean
        default: false
    secrets:
      PYPI_API_TOKEN:
        required: false
      R2_UPLOAD_TOKEN:
        required: false
      SIGNPATH_API_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      hub_only:
        description: Hub regressions only; keep publish_release disabled
        required: false
        type: boolean
        default: false
      sign_windows_release:
        description: Request SignPath signing for Windows release artifacts
        required: true
        type: boolean
        default: false
      publish_release:
        description: Publish verified artifacts to GitHub, PyPI and R2
        required: true
        type: boolean
        default: false
      replace_existing_release:
        description: Allow recovery publication to an existing unpublished draft
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keep manual verification runs from cancelling the required push/PR check.
  # Newer runs of the same event and ref may still replace stale work.
  group: preset-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-correctness:
    name: Python correctness
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.0
      - run: python -m ruff check python packaging scripts cmake

  portable-hub:
    name: Portable Hub regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Check out Hub and Web contract dependencies
        run: git submodule update --init --depth 1 external/plugins/infernux_mcp external/plugins/infernux_web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt shared libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0 libgl1
      - name: Install portable test dependencies
        run: python -m pip install pytest PySide6 packaging PyYAML setuptools wheel
      - name: Audit project synchronization contract
        run: |
          python scripts/maintenance/audit_project_sync.py tests/fixtures/multiplatform_player --tracked
      - name: Test critical Hub workflows without a native engine
        run: >-
          python -m pytest
          tests/hub
          tests/contracts
          -q -ra --junitxml out/test-results/portable-hub.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-hub-${{ matrix.os }}
          path: out/test-results/portable-hub.xml
          if-no-files-found: error

  windows-desktop:
    if: ${{ !inputs.hub_only }}
    needs: [portable-hub, python-correctness]
    runs-on: windows-2022
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    env:
      VULKAN_SDK_VERSION: "1.3.296.0"
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: infernux
          python-version: "3.13"
          auto-activate-base: false

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-windows

      - name: Cache pinned Windows software Vulkan driver
        id: cache-windows-swiftshader
        uses: actions/cache/restore@v4
        with:
          path: out\toolchains\windows-swiftshader
          key: windows-swiftshader-694585a05946e1ed49b6bd577ca6537cbb57f025-infernux-8sets-256push-v2

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          conda activate infernux
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkan_sdk.exe
          Start-Process -Wait -FilePath .\vulkan_sdk.exe -ArgumentList `
            "--accept-licenses","--default-answer","--confirm-command","install"

      - name: Install build and test dependencies
        shell: pwsh
        run: |
          conda activate infernux
          python -m pip install --disable-pip-version-check -r requirements.txt PyYAML requests

      - name: Build pinned Windows software Vulkan driver
        if: steps.cache-windows-swiftshader.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          conda activate infernux
          scripts\setup\build_windows_swiftshader.ps1 out\toolchains\windows-swiftshader

      - name: Save built Windows software Vulkan driver
        if: steps.cache-windows-swiftshader.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out\toolchains\windows-swiftshader
          key: ${{ steps.cache-windows-swiftshader.outputs.cache-primary-key }}

      - name: Configure Windows release preset
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          cmake --preset windows-msvc-release "-DCMAKE_PROJECT_Infernux_INCLUDE=$PWD/tests/acceptance/windows_software_vulkan.cmake"

      - name: Provide pinned software Vulkan for build and tests
        shell: pwsh
        run: |
          conda activate infernux
          $softwareVulkan = Resolve-Path "out\toolchains\windows-swiftshader\runtime\vk_swiftshader.dll"
          $destinations = @(
            "python\infernux\lib\vulkan-1.dll",
            "out\build\windows-msvc-release\Release\vulkan-1.dll"
          )
          foreach ($destination in $destinations) {
            $parent = Split-Path -Parent $destination
            New-Item -ItemType Directory -Path $parent -Force | Out-Null
            Copy-Item -LiteralPath $softwareVulkan -Destination $destination -Force
          }
          $swiftShaderManifest = Resolve-Path "out\toolchains\windows-swiftshader\runtime\vk_swiftshader_icd.json"
          if (-not (Test-Path $swiftShaderManifest)) {
            throw "The pinned Windows SwiftShader Vulkan ICD is missing."
          }
          "VK_DRIVER_FILES=$swiftShaderManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VK_ICD_FILENAMES=$swiftShaderManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows editor and native tests
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          cmake --build --preset windows-msvc-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-msvc-player
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run preset tests
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          New-Item -ItemType Directory -Path out\test-results -Force | Out-Null
          ctest --preset windows-msvc-release -LE "performance|requires_vulkan_device" --parallel 8 --timeout 120 --output-on-failure --output-junit "$PWD/out/test-results/ctest-windows.xml"

      - name: Run required Windows software GPU correctness gate
        shell: pwsh
        run: |
          conda activate infernux
          python tests/acceptance/software_vulkan_gate.py --preset windows-msvc-release --output out/test-results/gpu-windows

      - name: Install complete Windows test wheel
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          # This test wheel includes the pinned software Vulkan install rule.
          # The shipping wheel is rebuilt below without that rule.
          cmake --build --preset windows-msvc-install-wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run project shader declaration tests
        id: shader-declarations
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          Remove-Item Env:PYTHONPATH, Env:INFERNUX_NATIVE_MODULE_DIR -ErrorAction SilentlyContinue
          # Builtin-name overrides affect the entire project. Give these tests
          # a fresh native project before other scenarios author missing references.
          python -m pytest -o pythonpath= tests/python/test_shader_declaration_discovery.py -q --durations=10 --junitxml out/test-results/pytest-shader-declarations-windows.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native Python tests
        id: native-python
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          Remove-Item Env:PYTHONPATH, Env:INFERNUX_NATIVE_MODULE_DIR -ErrorAction SilentlyContinue
          # Windows CI uses the software Vulkan backend. Keep two isolated
          # engine processes active so the real-engine suite does not spend
          # its full runtime behind a single worker, while avoiding GPU
          # context pressure from unbounded parallelism.
          $parallelXml = "out\test-results\pytest-windows-parallel.xml"
          python -m pytest -n 2 --dist loadfile --max-worker-restart=0 -o pythonpath= `
            tests\python tests\isolated `
            --ignore=tests\python\test_shader_declaration_discovery.py `
            --ignore=tests\python\test_engine_play_mode.py `
            --ignore=tests\python\test_ui_shader_dependency_runtime.py `
            --ignore=tests\python\test_model_refresh_subassets.py `
            --ignore=tests\python\test_physics_drag_push.py `
            -q --durations=20 --junitxml $parallelXml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # These files exercise process-wide editor/render state. Run them
          # in one process so their lifecycle and software-Vulkan ordering
          # remains deterministic while the bulk of the suite stays parallel.
          python -m pytest -o pythonpath= `
            tests\python\test_engine_play_mode.py `
            tests\python\test_ui_shader_dependency_runtime.py `
            tests\python\test_model_refresh_subassets.py `
            tests\python\test_physics_drag_push.py `
            -q --durations=20 --junitxml out\test-results\pytest-windows.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows headless physics profile gate
        shell: pwsh
        run: |
          conda activate infernux
          Remove-Item Env:PYTHONPATH, Env:INFERNUX_NATIVE_MODULE_DIR -ErrorAction SilentlyContinue
          python tests/acceptance/physics_profile_gate.py | Tee-Object -FilePath out/test-results/physics-profile-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows editor wheel
        shell: pwsh
        run: |
          conda activate infernux
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          # The software driver belongs to test payloads, never shipped wheels.
          cmake --preset windows-msvc-release -U CMAKE_PROJECT_Infernux_INCLUDE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-msvc-wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and optionally sign the Windows Hub distribution
        uses: ./.github/actions/build-windows-hub
        with:
          signing: ${{ inputs.sign_windows_release && 'release-signing' || 'none' }}
          api-token: ${{ inputs.sign_windows_release && secrets.SIGNPATH_API_TOKEN || '' }}
          certificate-thumbprint: ${{ vars.SIGNPATH_RELEASE_CERTIFICATE_THUMBPRINT }}

      - name: Upload Windows desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/releases/*/*-win_amd64.whl
            dist/releases/*/InfernuxHubInstaller-*-windows-x64.exe
            dist/releases/*/InfernuxHub-*-windows-x64-full.zip
            dist/releases/*/InfernuxHub-windows-x64-manifest.json
          if-no-files-found: error

      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/test-results/*.xml
            out/test-results/physics-profile-windows.log
            out/test-results/gpu-windows/
            out/test-results/hub-startup-windows/
          if-no-files-found: warn

  linux-desktop:
    if: ${{ !inputs.hub_only }}
    needs: [portable-hub, python-correctness]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      SDL_AUDIODRIVER: dummy
      QT_QPA_PLATFORM: offscreen
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: infernux
          python-version: "3.13"
          auto-activate-base: false

      - name: Install Linux Vulkan build dependencies
        run: scripts/setup/install_linux_dependencies.sh

      - name: Install Python build and test dependencies
        run: |
          conda activate infernux
          conda install --yes --channel conda-forge "libpython-static=3.13.15"
          python -m pip install --disable-pip-version-check -r requirements.txt PyYAML requests

      - name: Run Hub tests
        run: |
          conda activate infernux
          mkdir -p out/test-results
          xvfb-run --auto-servernum env QT_QPA_PLATFORM=xcb PYTHONPATH=packaging python -m pytest tests/hub -q --junitxml out/test-results/pytest-hub-linux.xml

      - name: Configure Linux release preset
        run: |
          conda activate infernux
          cmake --preset linux-clang-release

      - name: Build Linux editor and native tests
        run: |
          conda activate infernux
          cmake --build --preset linux-clang-release
          cmake --build --preset linux-clang-player

      - name: Run Linux preset tests
        run: |
          conda activate infernux
          mkdir -p out/test-results
          ctest --preset linux-clang-release -LE "performance|requires_vulkan_device" --parallel 8 --timeout 120 --output-on-failure --output-junit "$PWD/out/test-results/ctest-linux.xml"

      - name: Run required Linux software GPU correctness gate
        run: |
          conda activate infernux
          xvfb-run --auto-servernum python tests/acceptance/software_vulkan_gate.py --preset linux-clang-release --output out/test-results/gpu-linux

      - name: Install complete Linux test wheel
        run: |
          conda activate infernux
          cmake --build --preset linux-clang-install-wheel

      - name: Run project shader declaration tests
        id: shader-declarations
        run: |
          conda activate infernux
          unset PYTHONPATH INFERNUX_NATIVE_MODULE_DIR
          # Builtin-name overrides require their own native project.
          xvfb-run --auto-servernum python -m pytest -o pythonpath= tests/python/test_shader_declaration_discovery.py -q --durations=10 --junitxml out/test-results/pytest-shader-declarations-linux.xml

      - name: Run native Python tests
        id: native-python
        run: |
          conda activate infernux
          unset PYTHONPATH INFERNUX_NATIVE_MODULE_DIR
          xvfb-run --auto-servernum python -m pytest -o pythonpath= tests/python tests/isolated --ignore=tests/python/test_shader_declaration_discovery.py -q --durations=20 --junitxml out/test-results/pytest-linux.xml

      - name: Run Linux headless physics profile gate
        run: |
          conda activate infernux
          unset PYTHONPATH INFERNUX_NATIVE_MODULE_DIR
          set -o pipefail
          python tests/acceptance/physics_profile_gate.py | tee out/test-results/physics-profile-linux.log

      - name: Build Linux editor wheel and Hub distribution
        run: |
          conda activate infernux
          cmake --build --preset linux-clang-wheel
          python -m pip install -r packaging/hub-build-requirements.txt
          cmake --build --preset linux-hub-installer
          HUB_VERSION=$(PYTHONPATH=packaging python -c 'from hub_release import project_hub_version; print(project_hub_version())')
          xvfb-run --auto-servernum python scripts/release/verify_hub_startup.py --hub out/stage/linux-clang-release/hub --version "$HUB_VERSION" --output out/test-results/hub-startup-linux

      - name: Upload Linux desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/releases/*/*.whl
            dist/releases/*/InfernuxHubInstaller-*-linux-x64
            dist/releases/*/InfernuxHub-*-linux-x64-full.zip
            dist/releases/*/InfernuxHub-linux-x64-manifest.json
          if-no-files-found: error

      - name: Upload Linux test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/test-results/*.xml
            out/test-results/physics-profile-linux.log
            out/test-results/gpu-linux/
            out/test-results/hub-startup-linux/
          if-no-files-found: warn

  release-player-acceptance:
    name: Validate Players before publication
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/platform-player.yml

  publish-release:
    name: Publish verified distributions
    needs: [portable-hub, windows-desktop, linux-desktop, release-player-acceptance]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      actions: read
      contents: write
      pages: write
    uses: ./.github/workflows/publish-desktop-release.yml
    with:
      run_id: ${{ github.run_id }}
      sign_windows_release: ${{ inputs.sign_windows_release }}
      replace_existing_release: ${{ inputs.replace_existing_release }}
    secrets: inherit
