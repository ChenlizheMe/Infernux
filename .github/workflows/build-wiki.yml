name: Build Wiki

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/build-wiki.yml"
      - ".github/workflows/website-quality.yml"
      - "docs/wiki/docs/**"
      - "docs/wiki/theme/**"
      - "docs/wiki/mkdocs.yml"
      - "docs/wiki/requirements.txt"
      - "docs/*.html"
      - "docs/*.json"
      - "docs/css/**"
      - "docs/js/**"
      - "docs/learn/**"
      - "docs/tools/**"
      - "docs/changelog/**"
      - "docs/docs-manifest.json"
      - "UpdateLog.md"
      - "UpdateLog-zh.md"
      - "pyproject.toml"
      - "python/infernux/version.py"
      - "README.md"
      - "README-zh.md"
      - ".github/media/**"
      - "python/infernux/engine/ui/project_file_ops.py"
      - "scripts/release/sync_release_site.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and commit website
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/wiki/requirements.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/wiki/requirements.txt

      - name: Build hand-authored learning chapters
        run: python docs/tools/build-learning-guides.py

      - name: Build bilingual release history
        run: python docs/tools/build-changelog.py

      - name: Generate API index
        run: node docs/tools/build-api-index.mjs

      - name: Stamp documentation build provenance
        env:
          DOCS_SOURCE_COMMIT: ${{ github.sha }}
        run: node docs/tools/stamp-docs-manifest.mjs

      - name: Load deterministic Wiki build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(node docs/tools/docs-source-date-epoch.mjs)" >> "$GITHUB_ENV"

      - name: Generate structured release notes
        run: node docs/tools/build-release-notes.mjs

      - name: Build static wiki
        env:
          PYTHONIOENCODING: utf-8
        run: python -m mkdocs build --strict --clean -f docs/wiki/mkdocs.yml

      - name: Optimize static Wiki output
        run: node docs/tools/optimize-static-site.mjs

      - name: Generate unified sitemap
        run: node docs/tools/build-sitemap.mjs

      - name: Generate route-localized bundles
        run: node docs/tools/build-i18n.mjs

      - name: Generate deterministic Service Worker
        run: node docs/tools/build-service-worker.mjs

      - name: Check API coverage, downloads, and release information
        run: node docs/tools/check-site-information.mjs

      - name: Test information checks and download selection
        run: |
          node --test docs/tools/test-site-information.mjs
          node docs/tools/test-download-client.mjs

      - name: Commit generated wiki output
        shell: bash
        run: |
          git add docs/wiki/docs docs/wiki/site docs/wiki/mkdocs.yml docs/wiki/mkdocs_api_nav.yml docs/docs-manifest.json docs/api-index.json docs/release-notes.json docs/wiki.html docs/start.html
          git add -A -- ':(glob)docs/css/wiki-template.*.css'
          git add docs/sw.js docs/sitemap.xml docs/js/i18n*.js
          git add docs/changelog.html docs/changelog/*.html

          if git diff --cached --quiet; then
            echo "No generated wiki changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate wiki [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
