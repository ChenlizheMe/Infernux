# All native payloads use this engine commit and its pinned plugin submodules.
name: Build Engine Versioned Platform Plugins
'on':
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
        working-directory: engine
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        submodules: recursive
        # llvmlite's wheel version is derived from its reachable release tag.
        fetch-depth: 0
        path: engine
    - uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: infernux
        python-version: '3.13.15'
        auto-activate-base: false
    - name: Install Vulkan SDK
      shell: pwsh
      run: |
        conda activate infernux
        $version = '1.3.296.0'
        $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
        Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" -OutFile $installer
        Start-Process -Wait -WindowStyle Hidden -WorkingDirectory $env:RUNNER_TEMP -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install'
        "VULKAN_SDK=C:\VulkanSDK\$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Install Vulkan Runtime
      timeout-minutes: 5
      shell: pwsh
      run: |
        conda activate infernux
        $version = '1.3.296.0'
        $runtimeInstaller = Join-Path $env:RUNNER_TEMP 'vulkan-runtime.exe'
        Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanRT-$version-Installer.exe" -OutFile $runtimeInstaller
        $runtimeProcess = Start-Process -Wait -PassThru -WindowStyle Hidden -WorkingDirectory $env:RUNNER_TEMP -FilePath $runtimeInstaller -ArgumentList '/auto'
        if ($runtimeProcess.ExitCode -ne 0) { throw "Vulkan Runtime installation failed: $($runtimeProcess.ExitCode)" }
    - name: Install Windows Player release dependencies
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        conda activate infernux
        conda install --yes --override-channels --channel https://repo.anaconda.com/pkgs/main `
          'python=3.13.15=h2e1fde4_102_cp313' 'zlib=1.3.2=h1c6eee0_0' `
          'libzlib=1.3.2=h1c6eee0_0' 'zstd=1.5.7=h56299aa_0' 'vc14_runtime=14.44.35208=h4927774_12'
        $llvmPrefix = Join-Path $env:RUNNER_TEMP 'infernux-llvm-22.1.2'
        conda create --yes --prefix $llvmPrefix --override-channels --channel conda-forge `
          'llvmdev=22.1.2=h830ff33_0' 'vc14_runtime=14.51.36247=habf1de7_41'
        python -m pip install --disable-pip-version-check -r requirements.txt `
          'numba==0.67.0' 'numpy==2.5.2' 'nuitka==4.2' 'packaging==26.3' `
          'cmake==4.4.2' 'setuptools==84.0.0' 'wheel==0.48.0' 'delvewheel==1.13.2' 'pefile==2024.8.26'
    - name: Build and install the native x64 CPU JIT wheel
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        conda activate infernux
        $python = Join-Path $env:CONDA_PREFIX 'python.exe'
        $cmake = Join-Path $env:CONDA_PREFIX 'Scripts/cmake.exe'
        & $cmake --preset windows-msvc-release -G 'Visual Studio 17 2022' -T v143 `
          "-DPython3_EXECUTABLE=$python" -DINFERNUX_PLAYER_PACKAGE_PLUGIN=OFF `
          -DINFERNUX_REFRESH_EDITOR_PLUGIN_RESOURCES=OFF -DINFERNUX_REQUIRE_CLEAN_WHEEL_SOURCE=ON

        $llvmPrefix = Join-Path $env:RUNNER_TEMP 'infernux-llvm-22.1.2'
        $releaseLibrary = Join-Path $env:CONDA_PREFIX 'Library'
        # Limit the SDK's DLL search contribution to the CRT named by the wheel notice.
        $repairPath = Join-Path $env:RUNNER_TEMP 'infernux-wheel-dlls'
        New-Item -ItemType Directory -Path $repairPath -Force | Out-Null
        Copy-Item -LiteralPath (Join-Path $llvmPrefix 'Library/bin/msvcp140.dll') -Destination $repairPath
        $releasePath = $env:PATH
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
        $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
        if (-not (Test-Path -LiteralPath (Join-Path $env:VSINSTALLDIR 'DIA SDK/lib/amd64/diaguids.lib') -PathType Leaf)) {
          throw 'The LLVM SDK requires the VS2022 x64 DIA library.'
        }
        $env:LLVM_DIR = Join-Path $llvmPrefix 'Library/lib/cmake/llvm'
        $env:CMAKE_PREFIX_PATH = $releaseLibrary
        $env:CMAKE_GENERATOR = 'Visual Studio 17 2022'
        $env:CMAKE_GENERATOR_ARCH = 'x64'
        $env:CMAKE_GENERATOR_TOOLKIT = 'v143'
        $env:CMAKE_BUILD_PARALLEL_LEVEL = '4'
        try {
          $env:PATH = "$repairPath;$releaseLibrary\bin;$env:CONDA_PREFIX\Scripts;$env:PATH"
          & $cmake --build --preset windows-msvc-release --target package_cpu_jit_dependency
        } finally {
          $env:PATH = $releasePath
        }

        $wheels = @(Get-ChildItem -LiteralPath 'out/stage/windows-msvc-release/cpu-jit-wheels' `
          -File -Filter 'llvmlite-*-cp313-cp313-win_amd64.whl')
        if ($wheels.Count -ne 1) { throw "Expected one repaired Windows x64 llvmlite wheel, got $($wheels.Count)." }
        & $python -m pip install --no-index --no-deps --force-reinstall $wheels[0].FullName
        @'
        import numba
        from llvmlite import binding as llvm

        assert llvm.llvm_version_info == (22, 1, 2)
        llvm.initialize_native_target()
        assert llvm.Target.from_default_triple().name == "x86-64"
        assert numba.njit(lambda value: value + 1)(41) == 42
        '@ | & $python -
    - name: Build the complete plugin directly with CMake
      run: |
        conda activate infernux
        cmake --build --preset windows-msvc-player
    - name: Package the exact engine release plugin
      run: |
        conda activate infernux
        python scripts/release/build_platform_plugins.py package --targets windows \
          --payload external/plugins/infernux_windows/package/editor/infernux_windows/player \
          --output out/platform-plugins
    - uses: actions/upload-artifact@v4
      with:
        name: engine-platform-windows-${{ github.run_id }}-${{ github.run_attempt }}
        path: engine/out/platform-plugins/
        if-no-files-found: error
        compression-level: 0
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
        working-directory: engine
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        submodules: recursive
        path: engine
    - uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: infernux
        python-version: '3.13'
        auto-activate-base: false
    - name: Install build dependencies
      run: scripts/setup/install_linux_dependencies.sh
    - name: Install release-engineering Python dependencies
      run: |
        conda activate infernux
        python -m pip install --disable-pip-version-check -r requirements.txt
    - name: Build the complete plugin directly with CMake
      run: |
        conda activate infernux
        cmake --preset linux-clang-release -DINFERNUX_PLAYER_PACKAGE_PLUGIN=OFF \
          -DINFERNUX_REFRESH_EDITOR_PLUGIN_RESOURCES=OFF -DINFERNUX_REQUIRE_CLEAN_WHEEL_SOURCE=ON
        cmake --build --preset linux-clang-player
    - name: Package the exact engine release plugin
      run: |
        conda activate infernux
        python scripts/release/build_platform_plugins.py package --targets linux \
          --payload external/plugins/infernux_linux/package/editor/infernux_linux/player \
          --output out/platform-plugins
    - uses: actions/upload-artifact@v4
      with:
        name: engine-platform-linux-${{ github.run_id }}-${{ github.run_attempt }}
        path: engine/out/platform-plugins/
        if-no-files-found: error
        compression-level: 0
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -el {0}
        working-directory: engine
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        submodules: recursive
        path: engine
    - uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: infernux
        python-version: '3.13'
        auto-activate-base: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Install release-engineering dependencies
      run: |
        conda activate infernux
        scripts/setup/install_linux_dependencies.sh
        python -m pip install --disable-pip-version-check -r requirements.txt
        sdkmanager "cmake;3.30.5" "ndk;27.3.13750724" "ndk;29.0.14206865"
    - uses: actions/cache@v4
      with:
        path: |
          engine/out/android-python
          engine/out/android-python-work
          engine/out/android-native
        key: android-plugin-${{ runner.os }}-${{ hashFiles('engine/cmake/**', 'engine/cpp/**', 'engine/CMakeLists.txt', 'engine/scripts/setup/*android*',
          'engine/external/plugins/infernux_android/native/**') }}
        restore-keys: |
          android-plugin-${{ runner.os }}-
    - name: Publish both native ABIs directly into the plugin
      run: |
        conda activate infernux
        for abi in arm64-v8a x86_64; do
          prefix="$PWD/out/android-python/$abi"
          if [[ ! -d "$prefix" ]]; then
            scripts/setup/build_android_python_runtime.sh "$abi" "$prefix" "$PWD/out/android-python-work"
          fi
          python external/plugins/infernux_android/native/build.py \
            --sdk "$ANDROID_SDK_ROOT" --python-prefix "$prefix" \
            --abi "$abi" --build-root "$PWD/out/android-native/$abi"
        done
    - name: Package the exact engine release plugin
      run: |
        conda activate infernux
        python scripts/release/build_platform_plugins.py package --targets android \
          --payload external/plugins/infernux_android/package/editor/infernux_android/player \
          --output out/platform-plugins
    - uses: actions/upload-artifact@v4
      with:
        name: engine-platform-android-${{ github.run_id }}-${{ github.run_attempt }}
        path: engine/out/platform-plugins/
        if-no-files-found: error
        compression-level: 0
  web-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        submodules: recursive
        path: engine
    - uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: infernux
        python-version: '3.13'
        auto-activate-base: false
    - uses: actions/cache@v4
      with:
        path: |
          engine/out/toolchains/web
          engine/out/build/web-precompiled-player
        key: web-runtime-${{ runner.os }}-${{ hashFiles('engine/scripts/setup/build_web_toolchain.sh', 'engine/external/plugins/infernux_web/native/**', 'engine/external/plugins/infernux_web/external/**')
          }}
        restore-keys: web-runtime-${{ runner.os }}-
    - name: Prepare release-engineering tools
      run: |
        conda activate infernux
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends ninja-build pkg-config libssl-dev libffi-dev zlib1g-dev libbz2-dev libsqlite3-dev liblzma-dev
        python -m pip install cmake
        engine/scripts/setup/build_web_toolchain.sh "$PWD/engine/out/toolchains/web"
        mkdir -p engine/out/build
        bash engine/external/plugins/infernux_web/native/python_runtime/build_numpy_static_runtime.sh \
          --root "$PWD/engine/out/build/web-numpy-static-runtime" \
          --host-python "$CONDA_PREFIX/bin/python"
    - name: Publish precompiled browser runtime into the build tree
      run: |
        conda activate infernux
        source engine/out/toolchains/web/emsdk/emsdk_env.sh
        python engine/external/plugins/infernux_web/native/build.py \
          --emsdk engine/out/toolchains/web/emsdk \
          --cpython-source engine/out/toolchains/web/src/Python-3.13.15 \
          --python-runtime-manifest engine/out/build/web-numpy-static-runtime/runtime/runtime-manifest.json \
          --numpy-payload-root engine/out/build/web-numpy-static-runtime/runtime/payload \
          --host-python "$CONDA_PREFIX/bin/python" \
          --player-output engine/out/build/web-precompiled-player/publish/player \
          --build-root engine/out/build/web-precompiled-player
    - uses: actions/upload-artifact@v4
      with:
        name: engine-release-web-player-${{ github.run_id }}-${{ github.run_attempt }}
        path: engine/out/build/web-precompiled-player/publish/player/
        if-no-files-found: error
  web-package:
    needs:
    - web-runtime
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: actions/download-artifact@v4
      with:
        name: engine-release-web-player-${{ github.run_id }}-${{ github.run_attempt }}
        path: out/platform-web/player
    - name: Package the exact engine release plugin
      run: >-
        python scripts/release/build_platform_plugins.py package --targets web
        --payload out/platform-web/player
        --output out/platform-plugins
    - uses: actions/upload-artifact@v4
      with:
        name: engine-platform-web-${{ github.run_id }}-${{ github.run_attempt }}
        path: out/platform-plugins/
        if-no-files-found: error
        compression-level: 0
  collect:
    needs:
    - windows
    - linux
    - android
    - web-package
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: actions/download-artifact@v4
      with:
        pattern: engine-platform-*-${{ github.run_id }}-${{ github.run_attempt }}
        merge-multiple: true
        path: out/platform-plugins
    - name: Verify all four plugins before publishing the catalog
      run: python scripts/release/build_platform_plugins.py assemble --output out/platform-plugins --source-revision ${{ github.sha }}
    - uses: actions/upload-artifact@v4
      with:
        name: engine-platform-plugins-${{ github.run_id }}-${{ github.run_attempt }}
        path: out/platform-plugins/
        if-no-files-found: error
        compression-level: 0
