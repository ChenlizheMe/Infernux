name: Publish Infernux Release

on:
  workflow_dispatch:
    inputs:
      sign_windows_release:
        description: Request SignPath signing (requires approved service and signing token)
        required: true
        type: boolean
        default: false
      replace_existing_release:
        description: Recover an unpublished draft; published changes require a new build or version
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pages: write

jobs:
  release-identity:
    name: Check release documentation identity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check packaged README versions and release notes
        run: |
          node docs/tools/check-readme.mjs
          python scripts/release/build_release_notes.py --output "$RUNNER_TEMP/release-notes.md" --signed "${{ inputs.sign_windows_release }}"
      - name: Check the published desktop Player release identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/publish_plugin_objects.py --check-player-releases

  build-test-publish:
    needs: release-identity
    uses: ./.github/workflows/ci.yml
    with:
      publish_release: true
      sign_windows_release: ${{ inputs.sign_windows_release }}
      replace_existing_release: ${{ inputs.replace_existing_release }}
    secrets: inherit
