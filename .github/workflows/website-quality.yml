name: Website Quality

on:
  pull_request:
    paths:
      - "docs/**"
      - "UpdateLog.md"
      - "UpdateLog-zh.md"
      - "pyproject.toml"
      - "python/infernux/version.py"
      - "README.md"
      - "README-zh.md"
      - ".github/media/**"
      - "python/infernux/engine/ui/project_file_ops.py"
      - "scripts/release/sync_release_site.py"
      - ".github/workflows/website-quality.yml"
      - ".github/workflows/build-wiki.yml"
      - ".github/workflows/website-health.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/DISCUSSION_TEMPLATE/**"
      - "scripts/docs/update_api_docs.bat"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify API, downloads, and release information
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Load deterministic Wiki build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(node docs/tools/docs-source-date-epoch.mjs)" >> "$GITHUB_ENV"

      - name: Generate API index from current documentation
        run: node docs/tools/build-api-index.mjs

      - name: Generate structured release notes
        run: node docs/tools/build-release-notes.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/wiki/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/wiki/requirements.txt

      - name: Build hand-authored learning chapters
        run: python docs/tools/build-learning-guides.py

      - name: Build bilingual release history
        run: python docs/tools/build-changelog.py

      - name: Build Wiki in strict mode
        env:
          PYTHONIOENCODING: utf-8
        run: python -m mkdocs build --strict --clean -f docs/wiki/mkdocs.yml

      - name: Optimize static Wiki output
        run: node docs/tools/optimize-static-site.mjs

      - name: Generate unified sitemap
        run: node docs/tools/build-sitemap.mjs

      - name: Generate route-localized bundles
        run: node docs/tools/build-i18n.mjs

      - name: Generate deterministic Service Worker
        run: node docs/tools/build-service-worker.mjs

      - name: Check API coverage, downloads, and release information
        run: node docs/tools/check-site-information.mjs

      - name: Test information checks and download selection
        run: |
          node --test docs/tools/test-site-information.mjs
          node docs/tools/test-download-client.mjs

      - name: Upload validated website preview
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          include-hidden-files: true
          path: |
            docs/
            !docs/tools/
            !docs/wiki/docs/
            !docs/wiki/theme/
            !docs/api-snapshots/
