name: Publish Desktop Release Artifacts

on:
  workflow_call:
    inputs:
      sign_windows_release:
        description: Require artifacts already signed with the release certificate during their build
        required: false
        type: boolean
        default: false
      run_id:
        description: Successful Desktop Release And Tests run ID
        required: true
        type: string
      release_tag:
        description: Release tag; empty derives the project version and wheel build
        required: false
        type: string
        default: ''
      replace_existing_release:
        description: Allow recovery publication to an existing unpublished draft
        required: false
        type: boolean
        default: false
    secrets:
      PYPI_API_TOKEN:
        required: true
      R2_UPLOAD_TOKEN:
        required: true
      SIGNPATH_API_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      sign_windows_release:
        description: Require artifacts already signed with the release certificate during their build
        required: true
        type: boolean
        default: false
      run_id:
        description: Successful Desktop Release And Tests run ID
        required: true
        type: string
      release_tag:
        description: Release tag; empty derives the project version and wheel build
        required: false
        default: ''
        type: string
      replace_existing_release:
        description: Allow recovery publication to an existing unpublished draft
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  pages: write

concurrency:
  group: desktop-release-publication
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      branch: ${{ steps.source.outputs.branch }}
      attempt: ${{ steps.source.outputs.attempt }}
    steps:
      - name: Resolve the source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        shell: pwsh
        run: |
          if ($env:RUN_ID -notmatch '^\d+$') { throw 'Invalid source run ID.' }
          $source = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($source.head_repository.full_name -ne $env:GITHUB_REPOSITORY -or $source.head_branch -notin @('master', 'main')) { throw 'Release source must be the official repository release branch.' }
          if ($source.path -notin @('.github/workflows/ci.yml', '.github/workflows/release.yml') -or $source.event -notin @('push', 'workflow_dispatch')) { throw 'Release source must be a trusted desktop build workflow, not a PR or signing test.' }
          if ($env:RUN_ID -ne $env:GITHUB_RUN_ID -and $source.conclusion -ne 'success') { throw 'The source build has not completed successfully.' }
          if ($source.head_sha -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source SHA.' }
          "sha=$($source.head_sha)" >> $env:GITHUB_OUTPUT
          "branch=$($source.head_branch)" >> $env:GITHUB_OUTPUT
          "attempt=$($source.run_attempt)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: windows-desktop-distribution-${{ inputs.run_id }}-${{ steps.source.outputs.attempt }}
          path: dist
      - name: Verify the real Windows signing state before any publication
        shell: pwsh
        env:
          REQUIRE_SIGNED: ${{ inputs.sign_windows_release }}
          CERTIFICATE: ${{ vars.SIGNPATH_RELEASE_CERTIFICATE_THUMBPRINT }}
        run: |
          $identity = python -c "import json,sys; sys.path.insert(0,'packaging'); from hub_release import project_version,project_hub_version; from build_hub import _windows_file_version; v=project_hub_version(); print(json.dumps([project_version(),v,_windows_file_version(v)]))" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & scripts/release/verify_windows_distribution.ps1 -ReleaseDirectory "dist/$($identity[0])" -HubVersion $identity[1] -ProductVersion $identity[2] -Thumbprint $env:CERTIFICATE -Signed:($env:REQUIRE_SIGNED -eq 'true')

  publish:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve the release identity
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "packaging")
          from hub_release import project_version, project_build_number, hub_version_for, release_tag_for
          version = project_version()
          build = project_build_number()
          requested = os.environ.get("REQUESTED_TAG", "").strip()
          tag = requested or release_tag_for(version, build)
          if tag != release_tag_for(version, build):
              raise SystemExit(f"Release tag {tag!r} does not match version/build {version}/{build}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"build={build}\n")
              output.write(f"hub_version={hub_version_for(version, build)}\n")
              output.write(f"tag={tag}\n")
          PY

      - name: Require a new published Hub version
        run: |
          python -m pip install --disable-pip-version-check 'packaging>=24.0'
          python scripts/release/build_release_catalog.py --check-version

      - name: Download verified desktop distributions
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: '*-desktop-distribution-${{ inputs.run_id }}-${{ needs.verify.outputs.attempt }}'
          merge-multiple: true
          path: dist

      - name: Validate the release payload
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          HUB_VERSION: ${{ steps.release.outputs.hub_version }}
          WHEEL_BUILD: ${{ steps.release.outputs.build }}
        run: |
          python - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          hub_version = os.environ["HUB_VERSION"]
          build = os.environ["WHEEL_BUILD"]
          root = Path("dist") / version
          wheel_prefix = f"infernux-{version}-{build}-cp313-cp313-"
          windows_wheel = f"{wheel_prefix}win_amd64.whl"
          linux_wheels = sorted(
              path.name
              for path in root.glob(f"{wheel_prefix}*.whl")
              if path.name != windows_wheel
          )
          if len(linux_wheels) != 1:
              raise SystemExit(
                  "Desktop release must contain exactly one audited Linux wheel: "
                  f"{linux_wheels}"
              )
          expected = {
              windows_wheel: "zip",
              linux_wheels[0]: "zip",
              f"InfernuxHubInstaller-{hub_version}-windows-x64.exe": "file",
              f"InfernuxHubInstaller-{hub_version}-linux-x64": "file",
              f"InfernuxHub-{hub_version}-windows-x64-full.zip": "zip",
              f"InfernuxHub-{hub_version}-linux-x64-full.zip": "zip",
              "InfernuxHub-windows-x64-manifest.json": "json",
              "InfernuxHub-linux-x64-manifest.json": "json",
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != set(expected):
              raise SystemExit(
                  f"Desktop release payload mismatch: missing={sorted(set(expected)-actual)}, "
                  f"unexpected={sorted(actual-set(expected))}"
              )
          for name, kind in expected.items():
              path = root / name
              if path.stat().st_size <= 0:
                  raise SystemExit(f"Empty release asset: {name}")
              if kind == "zip" and not zipfile.is_zipfile(path):
                  raise SystemExit(f"Invalid ZIP/wheel asset: {name}")
              if kind == "json":
                  document = json.loads(path.read_text(encoding="utf-8"))
                  if document.get("version") != hub_version:
                      raise SystemExit(f"Manifest version mismatch: {name}")
          with zipfile.ZipFile(root / windows_wheel) as archive:
              Path("dist/official-plugin-upload-catalog.json").write_bytes(
                  archive.read("infernux/resources/official_packages/official-registry.json")
              )
          print("Validated", len(expected), "desktop release assets")
          PY

      - name: Verify Cloudflare destinations against the actual wheel plugin catalog
        run: node tests/release/test-r2-upload-worker.mjs dist/official-plugin-upload-catalog.json

      - name: Create the release when needed
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
          REPLACE_EXISTING: ${{ inputs.replace_existing_release }}
          SIGNED: ${{ inputs.sign_windows_release }}
        run: |
          python scripts/release/build_release_notes.py --output dist/release-notes.md --signed "$SIGNED"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$draft" != "true" ]; then
              echo "Release $RELEASE_TAG is already public; increment the build number or project.version." >&2
              exit 1
            fi
            if [ "$REPLACE_EXISTING" != "true" ]; then
              echo "Draft $RELEASE_TAG already exists; use the recovery option explicitly." >&2
              exit 1
            fi
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "publish=$draft" >> "$GITHUB_OUTPUT"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Infernux ${RELEASE_TAG#v}" \
              --notes-file dist/release-notes.md \
              --draft
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the English changelog and signing disclosure
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body > dist/github-release-body.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path("dist/github-release-body.json").read_text())["body"]
          expected = Path("dist/release-notes.md").read_text(encoding="utf-8")
          if actual.replace("\r\n", "\n").strip() != expected.strip():
              raise SystemExit("GitHub Release body does not match the English changelog and signing disclosure")
          PY

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: gh release upload "$RELEASE_TAG" "dist/$RELEASE_VERSION/"* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify GitHub assets and preflight immutable PyPI files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > dist/github-assets.json
          python scripts/release/verify_publication.py --release-dir "dist/$RELEASE_VERSION" --github-json dist/github-assets.json --pypi-version "$RELEASE_VERSION" --allow-missing

      - name: Publish engine wheels to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m pip install --disable-pip-version-check twine
          python -m twine check "dist/$RELEASE_VERSION/"*.whl
          python -m twine upload --non-interactive --skip-existing "dist/$RELEASE_VERSION/"*.whl
          python scripts/release/verify_publication.py --release-dir "dist/$RELEASE_VERSION" --pypi-version "$RELEASE_VERSION"

      - name: Publish Hub artifacts to Cloudflare R2
        env:
          R2_UPLOAD_TOKEN: ${{ secrets.R2_UPLOAD_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          WHEEL_BUILD: ${{ steps.release.outputs.build }}
        run: >-
          python scripts/release/publish_hub_objects.py
          --release-dir "dist/$RELEASE_VERSION"
          --version "$RELEASE_VERSION"
          --build-number "$WHEEL_BUILD"

      - name: Publish the GitHub Release
        if: steps.github_release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Update the public Hub catalog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          WHEEL_BUILD: ${{ steps.release.outputs.build }}
          SOURCE_BRANCH: ${{ needs.verify.outputs.branch }}
        run: |
          published_at="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          if [ "$SOURCE_BRANCH" != "master" ] && [ "$SOURCE_BRANCH" != "main" ]; then
            echo "Refusing to publish the Hub catalog from branch: $SOURCE_BRANCH" >&2
            exit 1
          fi
          git fetch origin "$SOURCE_BRANCH"
          git checkout -B release-catalog "origin/$SOURCE_BRANCH"
          catalog_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          catalog_build="$(PYTHONPATH=packaging python -c 'from hub_release import project_build_number; print(project_build_number())')"
          if [ "$catalog_version" != "$RELEASE_VERSION" ] || [ "$catalog_build" != "$WHEEL_BUILD" ]; then
            echo "The release branch moved to version $catalog_version while publishing $RELEASE_VERSION" >&2
            exit 1
          fi
          python scripts/release/build_release_catalog.py \
            --release-dir "dist/$RELEASE_VERSION" \
            --published-at "$published_at" \
            --resolve-pypi
          python -m pip install --disable-pip-version-check -r docs/wiki/requirements.txt
          python scripts/release/sync_release_site.py
          if git diff --quiet -- docs README.md README-zh.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs README.md README-zh.md
          git commit -m "Publish ${RELEASE_TAG} distribution channels [skip ci]"
          git push origin "HEAD:$SOURCE_BRANCH"

      - name: Deploy and verify the public Hub catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release/deploy_hub_catalog.py
          --repository "$GITHUB_REPOSITORY"
          --commit "$(git rev-parse HEAD)"
          --catalog docs/hub-catalog.json
